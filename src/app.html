<!doctype html>
<html lang="%lang%" style="%accent%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- iOS Status Bar -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#0c0c0c" />

		<!-- Favicon e manifest: generati da scripts/generate-favicons.ts. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Image preload -->
		<link rel="preload" as="image" href="/noise.png" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=IBM+Plex+Sans:wght@300;400;500;600&family=Martian+Mono:wght@300..700&display=swap"
			rel="preload"
			as="style"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=IBM+Plex+Sans:wght@300;400;500;600&family=Martian+Mono:wght@300..700&display=swap"
			rel="stylesheet"
		/>

		<!-- umami analytics -->
		<script
			defer
			src="https://umami.essedev.it/script.js"
			data-website-id="fcbb5baf-7f04-4667-8289-8ffb42043012"
		></script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
