<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Concept E - Icone in movimento</title>
		<!--
			Concept E: un movimento per icona, all'hover, con le icone Lucide vere (tracciati
			copiati da @lucide/astro) alla taglia della lista (14 px) e ingrandite.
			Giro 2: porta del benvenuto scartata (ora luce, saltello, fumo); il battito si traccia;
			agente B e lista (mobile) A scelte; LED B ridotto al solo anello.
			Giro 3: Adesso (in cima) si ridisegna di continuo, tre modi senza dissolvenza: scelta A.
			Scelte finali, nel sito: B ovunque tranne Lista (mobile) A; Adesso dal giro 3, A.
			A  sobria: un gesto solo, breve.
			B  più marcata: il gesto più un secondo movimento.
			C  solo per l'agente: un terzo carattere.
			Si sceglie per icona (bottoni o clic sulla cella); la lista a sinistra usa le scelte,
			e la riga in alto le riassume da incollare. "Riproduci da sole" le anima senza hover.
			Nel sito: solo con @media (hover: hover), spente da prefers-reduced-motion.
		-->
		<style>
			@font-face { font-family: 'Geist'; font-weight: 400; src: url(https://cdn.jsdelivr.net/fontsource/fonts/geist@latest/latin-400-normal.woff2) format('woff2'); }
			@font-face { font-family: 'Geist'; font-weight: 500; src: url(https://cdn.jsdelivr.net/fontsource/fonts/geist@latest/latin-500-normal.woff2) format('woff2'); }
			@font-face { font-family: 'Departure Mono'; src: url(https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@main/public/assets/DepartureMono-Regular.woff2) format('woff2'); }

			:root {
				--desk: #050507;
				--bg: #0a0a0d;
				--pane: #0f0e15;
				--surface: rgb(255 255 255 / 0.05);
				--hover-veil: rgb(255 255 255 / 0.03);
				--line: #23232b;
				--fg: #efedf5;
				--text: #cbc9d4;
				--muted: #9c9aa8;
				--subtle: #908e9b;
				--accent: #b59cff;
				--live: #7dff9b;
				--archived: #4d4d58;
				--sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
				--mono: 'Departure Mono', ui-monospace, monospace;
				--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
				--spring: cubic-bezier(0.34, 1.56, 0.64, 1);
				color-scheme: dark;
			}

			* { box-sizing: border-box; }
			html, body { margin: 0; }
			body {
				min-height: 100vh;
				background:
					radial-gradient(22% 26% at 14% 6%, rgb(181 156 255 / 0.16), transparent),
					linear-gradient(135deg, rgb(110 80 255 / 0.10), transparent 60%),
					var(--desk);
				color: var(--text);
				font-family: var(--sans);
				-webkit-font-smoothing: antialiased;
			}
			button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

			.top {
				position: sticky;
				top: 0;
				z-index: 5;
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 12px 24px;
				padding: 14px 24px;
				background: rgb(5 5 7 / 0.8);
				backdrop-filter: blur(12px);
				border-bottom: 1px solid var(--line);
				font-family: var(--mono);
				font-size: 12px;
			}
			.top h1 { margin: 0; font-size: 13px; font-weight: 400; color: var(--fg); text-shadow: 0 0 3.5px rgb(181 156 255 / 0.55); }
			.top .hint { color: var(--subtle); }
			.top .spacer { flex: 1; }
			.toggle { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 6px; background: var(--surface); color: var(--muted); }
			.toggle[aria-pressed='true'] { color: var(--live); }
			.summary { display: flex; align-items: center; gap: 10px; width: 100%; color: var(--muted); }
			.summary code { font-family: var(--mono); color: var(--text); white-space: normal; }

			.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; padding: 24px; align-items: start; }
			@media (width < 60rem) { .layout { grid-template-columns: 1fr; } }

			/* La lista, come nel sito. */
			.sidebar {
				position: sticky;
				top: 112px;
				display: flex;
				flex-direction: column;
				border: 1px solid rgb(255 255 255 / 0.08);
				border-radius: 11px;
				background: rgb(18 16 28 / 0.55);
				backdrop-filter: blur(18px) saturate(170%);
				overflow: hidden;
			}
			@media (width < 60rem) { .sidebar { position: static; } }
			.sb-head { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 20px; }
			.logo { font-family: var(--mono); font-size: 13px; color: var(--fg); text-shadow: 0 0 3.5px rgb(181 156 255 / 0.55); }
			.caret { display: inline-block; width: 0.5em; height: 1.05em; margin-left: 0.15em; vertical-align: -0.15em; background: var(--accent); box-shadow: 0 0 5px var(--accent); animation: caret 1.1s steps(1) infinite; }
			@keyframes caret { 50% { opacity: 0; } }
			.icon-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; color: var(--subtle); transition: background-color 150ms, color 150ms; }
			.icon-btn:hover { background: var(--hover-veil); color: var(--fg); }
			.search { display: flex; align-items: center; gap: 8px; height: 36px; margin: 4px 12px 8px; padding: 0 6px 0 10px; border-radius: 6px; background: var(--surface); color: var(--subtle); font-family: var(--mono); font-size: 13px; }
			.search .ph { flex: 1; }
			.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 1.4rem; height: 1.4rem; padding: 0 0.35rem; border-radius: 4px; background: var(--surface); color: var(--muted); font-family: var(--mono); font-size: 11px; }
			.list { padding: 0 12px 16px; }
			.group-label { display: flex; justify-content: space-between; margin: 20px 0 4px; padding: 6px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtle); text-shadow: 0 0 3.5px rgb(181 156 255 / 0.55); }
			.row { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px; border-radius: 6px; color: var(--text); cursor: pointer; transition: background-color 150ms, color 150ms; }
			.row:hover { background: var(--hover-veil); color: var(--fg); }
			.row[aria-current] { background: var(--surface); color: var(--fg); }
			.slot { display: flex; justify-content: center; width: 16px; flex: none; color: var(--subtle); }
			.row .name { flex: 1; min-width: 0; overflow: hidden; font-size: 15px; white-space: nowrap; text-overflow: ellipsis; }
			.row.more { color: var(--subtle); }
			.row.more .name { font-family: var(--mono); font-size: 12px; }
			.status { display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid rgb(255 255 255 / 0.04); font-family: var(--mono); font-size: 11px; color: var(--subtle); }
			.links { display: flex; gap: 12px; }
			.links .t { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: color 150ms; }
			.links .t:hover { color: var(--fg); }
			.cmd { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--mono); font-size: 13px; cursor: pointer; transition: background-color 150ms; }
			.cmd:hover { background: rgb(255 255 255 / 0.08); }
			.cmd .name { flex: 1; }

			/* Le schede: una per icona, una cella per variante. */
			.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
			.card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 11px; background: rgb(15 14 21 / 0.85); border: 1px solid var(--line); }
			.card:has(.cell:nth-child(3)) { grid-column: span 2; }
			@media (width < 75rem) { .card:has(.cell:nth-child(3)) { grid-column: auto; } }
			.card header { display: flex; align-items: center; gap: 10px; }
			.card h2 { margin: 0; font-size: 15px; font-weight: 500; color: var(--fg); }
			.card header code { font-family: var(--mono); font-size: 11px; color: var(--subtle); }
			.pick { display: flex; gap: 2px; margin-left: auto; }
			.pick button { height: 24px; min-width: 24px; padding: 0 6px; border-radius: 4px; font-family: var(--mono); font-size: 11px; color: var(--subtle); }
			.pick button:hover { background: var(--hover-veil); color: var(--fg); }
			.pick button[aria-pressed='true'] { background: var(--surface); color: var(--accent); }
			.cells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; gap: 0 8px; }
			.cell { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 10px; min-width: 0; padding: 10px; border-radius: 10px; cursor: pointer; transition: background-color 150ms; }
			.cell > * { min-width: 0; }
			.cell:hover { background: var(--hover-veil); }
			.cell[aria-selected='true'] { background: var(--surface); }
			.cell .letter { font-family: var(--mono); font-size: 12px; color: var(--accent); }
			.cell p { margin: 2px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
			.stage { display: flex; align-items: center; justify-content: center; height: 96px; color: var(--text); }
			.cell .row { pointer-events: none; }
			.cell:hover .row { color: var(--fg); background: var(--hover-veil); }

			/* Icone. Le parti si muovono attorno al proprio riquadro. */
			.iw { display: inline-flex; --u: 1px; }
			.iw.lg { --u: 4px; }
			.ic { display: block; width: 14px; height: 14px; overflow: visible; }
			.iw.lg .ic { width: 56px; height: 56px; }
			.ic * { transform-box: fill-box; transform-origin: center; }
			.tone-live { color: var(--live); filter: drop-shadow(0 0 calc(2 * var(--u)) rgb(125 255 155 / 0.6)); }
			.tone-accent { color: var(--accent); filter: drop-shadow(0 0 calc(2.5 * var(--u)) rgb(181 156 255 / 0.7)); }
			.iw[data-v='b']:has(> .i-arrow, > .i-external) { overflow: hidden; }

			/* Adesso: la linea si traccia da sinistra e si cancella nello stesso verso, come su un
			   monitor, in loop. A lascia sotto la traccia fantasma; B no, l'icona si ridisegna da zero.
			   Il tracciato di Lucide va da destra a sinistra: si scopre dalla fine. */
			.i-activity .trace { opacity: 0; stroke-dasharray: 1 1; }
			.i-activity .base { transition: opacity 200ms; }
			.t:is(:hover, .hot) [data-v='a'] .i-activity .base { opacity: 0.22; }
			.t:is(:hover, .hot) [data-v='b'] .i-activity .base { opacity: 0; transition-duration: 0ms; }
			.t:is(:hover, .hot) :is([data-v='a'], [data-v='b']) .i-activity .trace { opacity: 1; animation: trace 1.6s linear infinite; }
			@keyframes trace {
				0% { stroke-dashoffset: -1; animation-timing-function: cubic-bezier(0.35, 0, 0.65, 1); }
				55%, 68% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
				100% { stroke-dashoffset: 1; }
			}

			/* Adesso, giro 3: la linea si ridisegna di continuo, senza dissolvenze. Il tracciato va
			   da destra a sinistra (pathLength 1): si scopre dalla fine. */
			.i-pulse .trace { stroke-dasharray: 1 1.1; }
			.t:is(:hover, .hot) :is([data-v='a'], [data-v='b']) .i-pulse .base { opacity: 0; }
			.t:is(:hover, .hot) [data-v='c'] .i-pulse .base { opacity: 0.3; }
			.i-pulse .base { transition: opacity 150ms; }
			.t:is(:hover, .hot) [data-v='a'] .i-pulse .trace { animation: snake 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
			.t:is(:hover, .hot) [data-v='b'] .i-pulse .trace { stroke-dasharray: 0.62 0.38; animation: comet 1s linear infinite; }
			.t:is(:hover, .hot) [data-v='c'] .i-pulse .trace { animation: overdraw 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
			@keyframes snake { 0% { stroke-dashoffset: -1.05; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1.05; } }
			@keyframes comet { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 1; } }
			@keyframes overdraw { 0% { stroke-dashoffset: -1.05; } 85%, 100% { stroke-dashoffset: 0; } }

			/* Agente: A sbatte gli occhi; B inclina la testa e l'antenna oscilla; C si guarda intorno. */
			.i-bot { transform-origin: 50% 90%; }
			.i-bot .antenna { transform-origin: 100% 100%; }
			.t:is(:hover, .hot) [data-v='a'] .i-bot .eye { animation: blink 900ms ease-in-out; }
			.t:is(:hover, .hot) [data-v='b'] .i-bot { animation: tilt 800ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-bot .antenna { animation: wiggle 800ms ease-out; }
			.t:is(:hover, .hot) [data-v='b'] .i-bot .eye { animation: blink 900ms ease-in-out 250ms; }
			.t:is(:hover, .hot) [data-v='c'] .i-bot .eye { animation: look 1.4s var(--ease-out); }
			@keyframes blink { 0%, 22%, 44%, 100% { transform: none; } 11%, 33% { transform: scaleY(0.1); } }
			@keyframes tilt { 0%, 100% { transform: none; } 25% { transform: rotate(-12deg); } 55% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } }
			@keyframes wiggle { 0%, 100% { transform: none; } 20% { transform: rotate(-25deg); } 45% { transform: rotate(18deg); } 70% { transform: rotate(-8deg); } }
			@keyframes look { 0%, 100% { transform: none; } 18%, 40% { transform: translateX(-2.5px); } 58%, 80% { transform: translateX(2.5px); } }

			/* Benvenuto: A la luce si accende nella porta, come un neon; B un saltello; C uno
			   sbuffo dal tetto. */
			.i-house { transform-origin: 50% 100%; }
			.i-house .light { fill: var(--accent); stroke: none; opacity: 0; }
			.i-house .puff { opacity: 0; stroke-width: 1.5; }
			.i-house .p2 { --d: 380ms; }
			.t:is(:hover, .hot) [data-v='a'] .i-house .light { animation: neon 700ms linear forwards; }
			.t:is(:hover, .hot) [data-v='a'] .i-house .door { color: var(--accent); transition: color 300ms 250ms; }
			.t:is(:hover, .hot) [data-v='b'] .i-house { animation: hop 700ms ease-out; }
			.t:is(:hover, .hot) [data-v='c'] .i-house .puff { animation: puff 1.1s ease-out var(--d, 0ms) backwards; }
			@keyframes neon { 0% { opacity: 0; } 12% { opacity: 0.55; } 18% { opacity: 0.08; } 30% { opacity: 0.6; } 36% { opacity: 0.2; } 100% { opacity: 0.5; } }
			@keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(2.5px, -7px) scale(1.5); } }
			@keyframes hop { 0%, 82%, 100% { transform: none; } 25% { transform: translateY(-22%) scale(0.94, 1.06); } 48% { transform: translateY(0) scale(1.1, 0.88); } 66% { transform: scale(0.97, 1.03); } }

			/* Chi sono: cenno; B ondeggia come un saluto. */
			.i-user { transform-origin: 50% 100%; }
			.t:is(:hover, .hot) [data-v='a'] .i-user .head { animation: nod 700ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-user { animation: sway 800ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-user .head { animation: nod 700ms var(--ease-out) 250ms; }
			@keyframes nod { 0%, 55%, 100% { transform: none; } 28% { transform: translateY(2px); } 78% { transform: translateY(1px); } }
			@keyframes sway { 0%, 100% { transform: none; } 22% { transform: rotate(-12deg); } 50% { transform: rotate(9deg); } 76% { transform: rotate(-4deg); } }

			/* Scritti: le righe si riscrivono da sinistra; B il foglio si solleva. */
			.i-file { transform-origin: 50% 100%; }
			.i-file .ln { stroke-dasharray: 1 1; }
			.i-file .l2 { --d: 90ms; }
			.i-file .l3 { --d: 180ms; }
			.t:is(:hover, .hot) [data-v='a'] .i-file .ln { animation: write 280ms var(--ease-out) var(--d, 0ms) backwards; }
			.t:is(:hover, .hot) [data-v='b'] .i-file { animation: lift 1s var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-file .ln { animation: write 320ms var(--ease-out) calc(var(--d, 0ms) + 200ms) backwards; }
			@keyframes write { from { stroke-dashoffset: -1; } to { stroke-dashoffset: 0; } }
			@keyframes lift { 0%, 100% { transform: none; } 25%, 70% { transform: translateY(-12%) rotate(-7deg); } }

			/* LED dei progetti: A lampo; B solo un anello tenue che si allarga. */
			.led { position: relative; display: inline-block; flex: none; width: calc(7 * var(--u)); height: calc(7 * var(--u)); border-radius: 999px; --c: var(--archived); background: var(--c); }
			.led[data-status='in-progress'] { --c: var(--live); box-shadow: 0 0 calc(5 * var(--u)) rgb(125 255 155 / 0.75); animation: breathe 2.8s var(--ease-out) infinite; }
			.led[data-status='maintained'] { --c: var(--live); box-shadow: 0 0 calc(2.5 * var(--u)) rgb(125 255 155 / 0.5); }
			.led[data-status='completed'] { --c: var(--fg); }
			.led[data-status='idea'] { --c: var(--muted); background: transparent; box-shadow: inset 0 0 0 calc(1.5 * var(--u)) var(--c); }
			.led::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 calc(0.8 * var(--u)) var(--c); opacity: 0; pointer-events: none; }
			.t:is(:hover, .hot) [data-v='a'] .led { animation: flash 550ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .led::after { animation: ping 700ms var(--ease-out); }
			@keyframes breathe { 50% { opacity: 0.55; box-shadow: 0 0 calc(2 * var(--u)) rgb(125 255 155 / 0.7); } }
			@keyframes flash { 30% { transform: scale(1.55); filter: brightness(1.5) drop-shadow(0 0 calc(4 * var(--u)) var(--c)); } }
			@keyframes ping { 0% { opacity: 0.55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.3); } }

			/* Tutti i N: A avanza con un rimbalzo; B esce a destra e rientra da sinistra. */
			[data-v='a'] .i-arrow { transition: translate 450ms var(--spring); }
			.t:is(:hover, .hot) [data-v='a'] .i-arrow { translate: 28% 0; }
			.t:is(:hover, .hot) [data-v='b'] .i-arrow { animation: out-x 560ms; }
			@keyframes out-x {
				0% { transform: none; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
				42% { transform: translateX(115%); }
				42.01% { transform: translateX(-115%); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
				100% { transform: none; }
			}

			/* Link esterni: A in diagonale con un rimbalzo; B esce e rientra dall'angolo opposto. */
			[data-v='a'] .i-external { transition: translate 450ms var(--spring); }
			.t:is(:hover, .hot) [data-v='a'] .i-external { translate: 18% -18%; }
			.t:is(:hover, .hot) [data-v='b'] .i-external { animation: out-diag 560ms; }
			@keyframes out-diag {
				0% { transform: none; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
				42% { transform: translate(115%, -115%); }
				42.01% { transform: translate(-115%, 115%); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
				100% { transform: none; }
			}

			/* Copia: al clic la spunta (A con un rimbalzo, B disegnata); B all'hover sposta il foglio. */
			.i-copy { transition: color 200ms; }
			.i-copy .cg { transition: opacity 200ms, transform 300ms var(--ease-out), translate 300ms var(--ease-out); }
			.i-copy .check { opacity: 0; stroke-dasharray: 1 1; }
			.t.done .i-copy { color: var(--live); }
			.t:is(:hover, .hot) [data-v='b'] .i-copy .front { translate: 1.5px 1.5px; }
			.t.done [data-v='a'] .i-copy .cg { opacity: 0; transform: scale(0.5); }
			.t.done [data-v='a'] .i-copy .check { animation: pop 450ms var(--spring) forwards; }
			.t.done [data-v='b'] .i-copy .cg { opacity: 0; }
			.t.done [data-v='b'] .i-copy .check { opacity: 1; animation: write 380ms var(--ease-out) backwards; }
			@keyframes pop { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: none; } }

			/* Cassetto: A il divisorio scorre; B il pannello si allarga. */
			.i-panel .fill { fill: currentColor; stroke: none; opacity: 0; transform-origin: 0 50%; }
			.t:is(:hover, .hot) [data-v='a'] .i-panel .divider { animation: slide 650ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-panel .divider { animation: slide-b 800ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-panel .fill { animation: grow 800ms var(--ease-out); }
			@keyframes slide { 0%, 100% { transform: none; } 35%, 55% { transform: translateX(4px); } }
			@keyframes slide-b { 0%, 100% { transform: none; } 35%, 60% { transform: translateX(6px); } }
			@keyframes grow { 0%, 100% { opacity: 0; transform: none; } 35%, 60% { opacity: 0.35; transform: scaleX(2); } }

			/* Chiudi: ruota; B le aste si ridisegnano. */
			.i-x { transition: rotate 350ms var(--ease-out); }
			.t:is(:hover, .hot) :is([data-v='a'], [data-v='b']) .i-x { rotate: 90deg; }
			.i-x .s { stroke-dasharray: 1 1; }
			.i-x .s2 { --d: 120ms; }
			.t:is(:hover, .hot) [data-v='b'] .i-x .s { animation: draw 300ms var(--ease-out) var(--d, 0ms) backwards; }
			@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

			/* Cerca: A le righe pulsano in cascata; B si pareggiano e tornano a imbuto. */
			.i-filter .l2 { --d: 70ms; }
			.i-filter .l3 { --d: 140ms; }
			.t:is(:hover, .hot) [data-v='a'] .i-filter .ln { animation: squeeze 500ms var(--spring) var(--d, 0ms); }
			.t:is(:hover, .hot) [data-v='b'] .i-filter .l1 { animation: eq1 850ms var(--ease-out); }
			.t:is(:hover, .hot) [data-v='b'] .i-filter .l3 { animation: eq3 850ms var(--ease-out); }
			@keyframes squeeze { 0%, 100% { transform: none; } 40% { transform: scaleX(0.55); } }
			@keyframes eq1 { 0%, 100% { transform: none; } 35%, 60% { transform: scaleX(0.6); } }
			@keyframes eq3 { 0%, 100% { transform: none; } 35%, 60% { transform: scaleX(2); } }
		</style>
	</head>
	<body>
		<div class="top">
			<h1>Concept E - Icone in movimento</h1>
			<span class="hint">Passa sopra una cella o una riga. Clic su una cella per sceglierla.</span>
			<span class="spacer"></span>
			<button class="toggle" id="autoplay" aria-pressed="false">Riproduci da sole</button>
			<div class="summary">
				<span>Scelte:</span><code id="summary"></code>
				<button class="toggle" id="copy-summary">Copia</button>
			</div>
		</div>

		<div class="layout">
			<nav class="sidebar" aria-label="Lista di prova">
				<div class="sb-head">
					<span class="logo">esse.dev<span class="caret"></span></span>
					<span style="display: flex">
						<span class="icon-btn t" data-id="panel" title="Lista (mobile)"></span>
						<span class="icon-btn t" data-id="x" title="Chiudi"></span>
					</span>
				</div>
				<div class="search t" data-id="filter"><span class="slot-icon"></span><span class="ph">Cerca</span><span class="kbd">/</span></div>
				<div class="list" id="list"></div>
				<div class="status">
					<div class="cmd t" data-id="copy"><span class="name">pnpm dlx portsage</span></div>
					<div class="links" id="links"></div>
				</div>
			</nav>

			<main class="cards" id="cards"></main>
		</div>

		<script>
			const ACT = 'M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2';
			// Tracciati di Lucide (@lucide/astro), con una classe per le parti che si muovono.
			const ICONS = {
				activity: [['path', { d: ACT, class: 'base' }], ['path', { d: ACT, class: 'trace', pathLength: 1 }]],
				pulse: [['path', { d: ACT, class: 'base' }], ['path', { d: ACT, class: 'trace', pathLength: 1 }]],
				bot: [
					['path', { d: 'M12 6V2H8', class: 'antenna' }],
					['path', { d: 'M15 11v2', class: 'eye' }],
					['path', { d: 'M2 12h2' }],
					['path', { d: 'M20 12h2' }],
					['path', { d: 'M20 16a2 2 0 0 1-2 2H8.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 4 20.286V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z' }],
					['path', { d: 'M9 11v2', class: 'eye' }]
				],
				house: [
					['path', { d: 'M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8z', class: 'light' }],
					['path', { d: 'M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8', class: 'door' }],
					['circle', { cx: 18, cy: 4.5, r: 1.2, class: 'puff p1' }],
					['circle', { cx: 18, cy: 4.5, r: 1.2, class: 'puff p2' }],
					['path', { d: 'M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' }]
				],
				user: [
					['path', { d: 'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2' }],
					['circle', { cx: 12, cy: 7, r: 4, class: 'head' }]
				],
				file: [
					['path', { d: 'M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z' }],
					['path', { d: 'M14 2v5a1 1 0 0 0 1 1h5' }],
					['path', { d: 'M10 9H8', class: 'ln l1', pathLength: 1 }],
					['path', { d: 'M16 13H8', class: 'ln l2', pathLength: 1 }],
					['path', { d: 'M16 17H8', class: 'ln l3', pathLength: 1 }]
				],
				arrow: [['path', { d: 'M5 12h14' }], ['path', { d: 'm12 5 7 7-7 7' }]],
				external: [['path', { d: 'M7 7h10v10' }], ['path', { d: 'M7 17 17 7' }]],
				copy: [
					['rect', { width: 14, height: 14, x: 8, y: 8, rx: 2, ry: 2, class: 'cg front' }],
					['path', { d: 'M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2', class: 'cg' }],
					['path', { d: 'M20 6 9 17l-5-5', class: 'check', pathLength: 1 }]
				],
				panel: [
					['rect', { width: 6, height: 18, x: 3, y: 3, rx: 2, class: 'fill' }],
					['rect', { width: 18, height: 18, x: 3, y: 3, rx: 2 }],
					['path', { d: 'M9 3v18', class: 'divider' }]
				],
				x: [['path', { d: 'M18 6 6 18', class: 's s1', pathLength: 1 }], ['path', { d: 'm6 6 12 12', class: 's s2', pathLength: 1 }]],
				filter: [
					['path', { d: 'M2 5h20', class: 'ln l1' }],
					['path', { d: 'M6 12h12', class: 'ln l2' }],
					['path', { d: 'M9 19h6', class: 'ln l3' }]
				]
			};
			const TONE = { activity: 'tone-live', pulse: 'tone-live', bot: 'tone-accent' };

			const CARDS = [
				{ id: 'pulse', name: 'Adesso (giro 3)', lucide: 'Activity', v: { a: 'Serpente: si disegna da sinistra e si ritira nello stesso verso, senza dissolvenza.', b: 'Cometa: un tratto lungo scorre senza fine, rientra a sinistra mentre esce a destra.', c: 'Su traccia: la linea resta tenue e una nuova la ridisegna sopra, di continuo.' } },
				{ id: 'house', name: 'Benvenuto', lucide: 'House', v: { a: 'Dentro la porta si accende una luce, come un neon.', b: 'La casa fa un saltello.', c: 'Due sbuffi di fumo dal tetto.' } },
				{ id: 'user', name: 'Chi sono', lucide: 'User', v: { a: 'Un cenno con la testa.', b: 'Ondeggia come un saluto, poi il cenno.' } },
				{ id: 'activity', name: 'Adesso', lucide: 'Activity', v: { a: 'La linea si traccia e si cancella, sopra una traccia fantasma.', b: 'La linea sparisce e si ritraccia da zero.' } },
				{ id: 'bot', name: 'Agente', lucide: 'BotMessageSquare', v: { a: 'Sbatte gli occhi due volte.', b: "Inclina la testa, l'antenna oscilla, sbatte gli occhi.", c: 'Si guarda intorno: occhi a sinistra, a destra, al centro.' } },
				{ id: 'led', name: 'relay', lucide: 'LED (CSS)', status: 'in-progress', v: { a: 'Un lampo più forte, poi torna al respiro.', b: 'Solo un anello tenue che si allarga.' } },
				{ id: 'file', name: 'Il mio nuovo laboratorio', lucide: 'FileText', v: { a: 'Le righe si riscrivono una dopo l’altra.', b: 'Il foglio si solleva e le righe si riscrivono.' } },
				{ id: 'arrow', name: 'tutti i 24', lucide: 'ArrowRight', more: true, v: { a: 'Avanza con un rimbalzo e resta avanti.', b: 'Esce a destra e rientra da sinistra.' } },
				{ id: 'external', name: 'GitHub', lucide: 'ArrowUpRight', v: { a: 'Avanza in diagonale con un rimbalzo.', b: "Esce in alto a destra e rientra dall'angolo opposto." } },
				{ id: 'copy', name: 'pnpm dlx portsage', lucide: 'Copy, Check', v: { a: 'Al clic la spunta compare con un rimbalzo.', b: "All'hover il foglio davanti scivola; al clic la spunta si disegna." } },
				{ id: 'panel', name: 'Lista (mobile)', lucide: 'PanelLeft', v: { a: 'Il divisorio scorre e torna.', b: 'Il pannello si allarga e si richiude.' } },
				{ id: 'x', name: 'Chiudi', lucide: 'X', v: { a: 'Ruota di 90° e resta.', b: 'Le due aste si ridisegnano mentre ruota.' } },
				{ id: 'filter', name: 'Cerca', lucide: 'ListFilter', v: { a: 'Le righe pulsano in cascata.', b: 'Le righe si pareggiano e tornano a imbuto.' } }
			];

			const choice = Object.fromEntries(CARDS.map((c) => [c.id, 'a']));
			choice.bot = 'b';

			const attrs = (a) => Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ');
			const svg = (name) =>
				`<svg class="ic i-${name} ${TONE[name] ?? ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name].map(([tag, a]) => `<${tag} ${attrs(a)}/>`).join('')}</svg>`;
			// Il contenitore porta la variante: nella lista segue la scelta, nelle schede è fissa.
			const icon = (id, { v = choice[id], size = '', status = 'in-progress' } = {}) =>
				`<span class="iw ${size}" data-for="${size ? '' : id}" data-v="${v}">${id === 'led' ? `<span class="led" data-status="${status}"></span>` : svg(id)}</span>`;
			const row = (id, name, extra = {}) =>
				`<div class="row t ${extra.more ? 'more' : ''}" data-id="${id}" ${extra.current ? 'aria-current="page"' : ''}><span class="slot">${icon(id, extra)}</span><span class="name">${name}</span></div>`;

			// La lista.
			const projects = [['relay', 'in-progress'], ['nexus', 'in-progress'], ['pgbee', 'maintained'], ['zeno', 'idea'], ['mcpbelt', 'maintained'], ['portsage', 'completed']];
			document.getElementById('list').innerHTML = [
				row('house', 'Benvenuto', { current: true }),
				row('user', 'Chi sono'),
				row('pulse', 'Adesso'),
				row('bot', 'Agente'),
				'<div class="group-label"><span>Progetti</span><span>24</span></div>',
				...projects.map(([n, s]) => row('led', n, { status: s })),
				row('arrow', 'tutti i 24', { more: true }),
				'<div class="group-label"><span>Scritti</span><span>1</span></div>',
				row('file', 'Il mio nuovo laboratorio')
			].join('');
			document.querySelector('[data-id="panel"]').innerHTML = icon('panel');
			document.querySelector('[data-id="x"]').innerHTML = icon('x');
			document.querySelector('.search .slot-icon').outerHTML = icon('filter');
			document.querySelector('.cmd').insertAdjacentHTML('beforeend', icon('copy'));
			document.getElementById('links').innerHTML = ['GitHub', 'LinkedIn', 'Email']
				.map((n) => `<span class="t" data-id="external">${n}${icon('external')}</span>`)
				.join('');

			// Le schede.
			document.getElementById('cards').innerHTML = CARDS.map((c) => {
				const letters = Object.keys(c.v);
				const cells = letters
					.map(
						(v) => `<div class="cell t" data-id="${c.id}" data-pick="${v}">
							<div><span class="letter">${v.toUpperCase()}</span><p>${c.v[v]}</p></div>
							<div class="stage">${icon(c.id, { v, size: 'lg', status: c.status })}</div>
							<div class="row ${c.more ? 'more' : ''}"><span class="slot">${icon(c.id, { v, size: 'sm', status: c.status })}</span><span class="name">${c.name}</span></div>
						</div>`
					)
					.join('');
				const pick = [...letters, 'none']
					.map((v) => `<button data-card="${c.id}" data-pick="${v}">${v === 'none' ? 'nessuna' : v.toUpperCase()}</button>`)
					.join('');
				return `<article class="card"><header><h2>${c.name}</h2><code>${c.lucide}</code><div class="pick">${pick}</div></header><div class="cells">${cells}</div></article>`;
			}).join('');

			function render() {
				for (const el of document.querySelectorAll('.sidebar .iw')) el.dataset.v = choice[el.dataset.for];
				for (const b of document.querySelectorAll('.pick button')) b.setAttribute('aria-pressed', String(choice[b.dataset.card] === b.dataset.pick));
				for (const c of document.querySelectorAll('.cell')) c.setAttribute('aria-selected', String(choice[c.dataset.id] === c.dataset.pick));
				document.getElementById('summary').textContent = CARDS.map((c) => `${c.name} ${choice[c.id] === 'none' ? 'nessuna' : choice[c.id].toUpperCase()}`).join(', ');
			}

			const flashDone = (t) => {
				t.classList.add('done');
				clearTimeout(t._done);
				t._done = setTimeout(() => t.classList.remove('done'), 1600);
			};

			document.addEventListener('click', (e) => {
				const btn = e.target.closest('.pick button');
				if (btn) {
					choice[btn.dataset.card] = btn.dataset.pick;
					return render();
				}
				const cell = e.target.closest('.cell');
				if (cell) {
					choice[cell.dataset.id] = cell.dataset.pick;
					render();
				}
				const t = e.target.closest('.t[data-id="copy"]');
				if (t) flashDone(t);
			});

			document.getElementById('copy-summary').addEventListener('click', async (e) => {
				await navigator.clipboard.writeText(document.getElementById('summary').textContent);
				e.target.textContent = 'Copiato';
				setTimeout(() => (e.target.textContent = 'Copia'), 1400);
			});

			// Riproduci da sole: ogni 2,4 s tutte le icone ripartono, come se il puntatore entrasse.
			let timer = 0;
			function cycle() {
				const ts = document.querySelectorAll('.t');
				ts.forEach((t) => t.classList.remove('hot'));
				requestAnimationFrame(() =>
					requestAnimationFrame(() => {
						ts.forEach((t) => t.classList.add('hot'));
						setTimeout(() => document.querySelectorAll('.t[data-id="copy"]').forEach(flashDone), 500);
					})
				);
				setTimeout(() => ts.forEach((t) => t.classList.remove('hot')), 1800);
			}
			document.getElementById('autoplay').addEventListener('click', (e) => {
				const on = e.target.getAttribute('aria-pressed') !== 'true';
				e.target.setAttribute('aria-pressed', String(on));
				clearInterval(timer);
				if (on) {
					cycle();
					timer = setInterval(cycle, 2400);
				}
			});

			render();
		</script>
	</body>
</html>
