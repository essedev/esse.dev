		<title>Concept N - Sub-agent</title>
		<!--
			Concept N: come il visitatore vede i sub-agent di delegate al lavoro e passa dalla chat
			con l'agente alla trascrizione di uno di loro, mentre continua a parlare.
			Tasti: x a b c per la variante, t tema, m larghezza telefono (390), r riavvia la
			simulazione, p nasconde la barra.

			Il problema: dopo DECISIONS #33 i sub-agent lavorano in background, ma la pagina mostra
			ancora la card di #14 (si riempie solo a lavoro finito) e il report del sub-agent arriva
			come un messaggio del visitatore con l'intestazione "[sub-agent #26 ...]".

			X  oggi, dopo d3839b3: il risultato di delegate non è più il JSON che DelegateView legge,
			   quindi la chiamata cade sulla riga generica del tool; niente si vede del lavoro dei
			   sub-agent, e il report arriva come messaggio del visitatore con l'intestazione per il
			   modello.
			A  schede: una riga di schede in cima alla conversazione, l'agente e un sub-agent per
			   scheda. La scheda di un sub-agent sostituisce la conversazione con la sua
			   trascrizione dal vivo; il campo diventa una riga in sola lettura con Ferma.
			B  binario: i sub-agent stanno sul pannello del campo, una fila di chip sopra la riga di
			   scrittura. Un chip apre la trascrizione in un foglio che sale sopra la conversazione;
			   il campo resta sotto e si continua a scrivere all'agente mentre si guarda.
			C  nel filo: niente cromatura nuova. La card di delegate nella conversazione è viva:
			   ogni sub-agent si apre sul posto con la sua traccia. Un chip "2 al lavoro" nella riga
			   del modello riporta alla card quando è salita fuori vista.

			Uguale in A, B e C (non è l'asse): il report arriva come una sua riga, "sub-agent #15
			finito", con risultati richiudibili, mai come messaggio del visitatore; poi risponde
			l'agente. Un sub-agent fermato non fa parlare l'agente (#33): cambia solo il suo stato.

			Mappatura sul codice di oggi (fattibilità, non piano): la lista e gli stati arrivano col
			messaggio `children` del socket (protocol.ts); la trascrizione di un sub-agent è una
			seconda connessione `?session=<id>` con gli stessi eventi di pi, già proiettati da
			transcript.ts; Ferma è `abort` su quella connessione. Il report si riconosce con
			`parseReport` (delegate.ts). Nuovo: lo stato del client per più sessioni (view.ts ne
			segue una), il componente della scheda o del foglio, la riga del report. Il foglio di B è
			un vetro accanto a quello del campo, non dentro: la regola del vetro nel vetro (#16)
			regge. Nessun dato manca.

			Dati: la conversazione è quella vera della preview del 27/10 (due sub-agent su
			triage.ts e budget.ts, una battuta in mezzo), accorciata; token e crediti sono quelli
			misurati. I tempi sono compressi (circa 12 s invece di 15-20).

			Scelta: B. Nel codice il foglio sta nel blocco ancorato in fondo al pannello, sopra il
			campo, alto min(30rem, 55dvh), invece di occupare tutta l'altezza come qui: stesso
			comportamento, un elemento fisso in meno. Resta aperto il telefono, dove chip e campo
			lasciano al foglio poco più di metà schermo.
		-->

		<script>
			const DESC = {
				x: 'oggi: delegate come riga generica del tool, report come messaggio del visitatore',
				a: 'schede: ogni sub-agent ha la sua scheda, la scheda prende tutta la conversazione',
				b: 'binario: chip sul pannello del campo, la trascrizione in un foglio, si scrive intanto',

			const KEY = `concept:${location.pathname}`;
			const root = document.documentElement;
			const body = document.body;
			const $ = (s) => document.querySelector(s);
			const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
			const md = (s) => s.split('\n\n').map((p) => `<p>${esc(p).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')}</p>`).join('');
			const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };

			// The conversation of the preview, shortened. Times in ms from the start.
			const CHILDREN = {
				15: { title: 'Legge triage.ts', task: 'Leggi src/agent/triage.ts nel repo essedev/esse.dev e riassumi come funziona il triage: classi, soglie, cosa succede se Jev non risponde.', tokens: '8,5k', credits: 15 },

			};
			const ANSWERS = {
				15: 'Prima del modello, Jev (TypeSafe, via OpenRouter) classifica ogni messaggio in circa 300 ms: intento (about, code, chat, offtopic, abuse), peso e lingua, con le probabilità. `admits()` ferma offtopic e abuse sopra soglia, la lingua decide quella della risposta, la chiacchiera accende la modalità breve. Se Jev non risponde entro 3 s il messaggio passa: il limite vero è il budget. File: `src/agent/triage.ts`, `admit` in `site-agent.ts`.',

			const SCRIPT = [
				[0, { type: 'user', text: 'Come funzionano il triage e il budget di questo sito? Fallo fare a due sub-agent, uno per parte.', verdict: 'code · medium · it' }],
				[900, { type: 'assistant', text: 'Avvio due sub-agent, uno sul triage e uno sul budget. Intanto puoi continuare a scrivermi, oppure guardarli lavorare.', delegate: [15, 26], usage: '3,1k token · 3 crediti' }],
				[1500, { child: 15, call: ['read_file', 'essedev/esse.dev src/agent/triage.ts'] }],
				[1900, { child: 26, call: ['read_file', 'essedev/esse.dev src/agent/budget.ts'] }],
				[3000, { type: 'user', text: 'intanto raccontami una battuta breve', verdict: 'chat · light · it' }],
				[3200, { child: 26, call: ['search_code', 'essedev/esse.dev VISITOR_DAILY_USD'] }],
				[4100, { type: 'assistant', text: 'Un agente AI entra in un bar e chiude subito il conto: ha finito i crediti a mezzogiorno. Intanto i due sub-agent sono ancora sui file.', usage: '2,2k token · 1 credito' }],
				[5200, { child: 15, call: ['read_file', 'essedev/esse.dev src/agent/site-agent.ts:800'] }],
				[7000, { child: 15, done: true }],
				[7100, { type: 'report', child: 15 }],
				[8300, { type: 'assistant', afterReport: true, text: 'Il primo sub-agent ha finito. Ogni tuo messaggio passa prima da **Jev**, un modello piccolo che in circa 300 ms ne decide intento, peso e lingua: fuori tema e abusi si fermano lì, e se Jev tace il messaggio passa comunque. Quello sul budget sta ancora lavorando.', usage: '4,0k token · 4 crediti' }],
				[9000, { child: 26, call: ['read_file', 'essedev/esse.dev src/agent/ledger.ts'] }],
				[11300, { child: 26, done: true }],
				[11400, { type: 'report', child: 26 }],
				[12600, { type: 'assistant', afterReport: true, text: 'Anche il secondo ha finito, quindi il quadro è completo: il triage decide **se** un messaggio arriva al modello, il budget **quanto** può costare. Il costo è quello reale di ogni risposta, con tre tetti al giorno (tuo, della tua rete, del sito) che si azzerano a mezzanotte UTC.', usage: '4,6k token · 5 crediti' }]
			];

			let state;
			let timers = [];
			const reset = () => {
				timers.forEach(clearTimeout);
				timers = [];
				state = {
					log: [],
					children: {},
					view: 'main',
					sheet: null,
					open: {},
					unread: 0,
					t0: Date.now()
				};
				render();
				for (const [at, step] of SCRIPT) timers.push(setTimeout(() => apply(step), at));
			};

			function apply(step) {
				if (step.child && !step.type) {
					const c = state.children[step.child];
					if (!c || c.status !== 'working') return;
					if (step.call) c.events.push({ call: step.call });
					if (step.done) {
						c.events.push({ text: ANSWERS[step.child] });
						c.status = 'done';
					}
				} else if (step.type === 'report') {
					if (state.children[step.child].status !== 'done') return;
					state.log.push(step);
					if (state.view !== 'main') state.unread++;
				} else if (step.afterReport) {
					// An answer to a report: only if that report reached the chat.
					const last = state.log.at(-1);
					if (last?.type !== 'report') return;
					state.log.push(step);
					if (state.view !== 'main') state.unread++;
				} else {
					state.log.push(step);
					if (step.delegate) for (const id of step.delegate) state.children[id] = { id, ...CHILDREN[id], status: 'working', events: [] };
					if (state.view !== 'main' && step.type === 'assistant') state.unread++;
				}
				render();
			}

			function stop(id) {
				const c = state.children[id];
				if (c?.status !== 'working') return;
				c.status = 'stopped';
				render();
			}

			const STATUS = { working: 'al lavoro', done: 'finito', stopped: 'fermato', failed: 'senza risultati' };
			const childList = () => Object.values(state.children);
			const live = () => childList().filter((c) => c.status === 'working');

			// Pieces.
			const userHtml = (m) => `<div><p class="user" style="margin:0"><span class="caret glowtext" aria-hidden="true">›</span><span>${esc(m.text)}</span></p><p class="verdict meta" style="margin:6px 0 0">${m.verdict}</p></div>`;

			function traceHtml(c, full) {
				const items = c.events.map((e) => (e.call ? `<div class="t-call"><span class="led" data-status="done"></span><span><span style="color:var(--fg)">${e.call[0]}</span> ${esc(e.call[1])}</span></div>` : `<div class="t-text prose">${md(e.text)}</div>`));
				if (c.status === 'working') items.push(`<div class="now typing">sta leggendo</div>`);
				if (c.status === 'stopped') items.push(`<div class="now">Fermato da te: non manderà risultati.</div>`);
				return items.join('');
			}

			function delegateHtml(ids) {
				const v = body.dataset.v;
				const rows = ids.map((id) => {
					const c = state.children[id];
					const right = c.status === 'working' ? `<span>${STATUS[c.status]}</span>` : `<span>${STATUS[c.status]}${c.status === 'done' ? ` · ${c.tokens} token · ${c.credits} crediti` : ''}</span>`;
					if (v === 'c') {
						const open = !!state.open[id];
						const stopBtn = c.status === 'working' ? `<button class="chip" data-stop="${id}">Ferma</button>` : '';
						return `<li><button class="row row-btn" data-toggle="${id}" aria-expanded="${open}"><span class="led" data-status="${c.status}"></span><span class="title">${esc(c.title)}</span><span class="right">${right}</span></button>${open ? `<div class="trace">${traceHtml(c)}${stopBtn ? `<div>${stopBtn}</div>` : ''}</div>` : ''}</li>`;
					}
					const target = v === 'a' ? `data-tab="${id}"` : `data-sheet-open="${id}"`;
					return `<li><button class="row row-btn" ${target}><span class="led" data-status="${c.status}"></span><span class="title">${esc(c.title)}</span><span class="right">${right}</span></button></li>`;
				});
				const head = `delegate · ${ids.length} sub-agent${v === 'c' ? '' : ' · apri per guardarli'}`;
				return `<section class="delegate" data-delegate><h3>${head}</h3><ol>${rows.join('')}</ol></section>`;
			}

			function reportHtml(id) {
				const c = state.children[id];
				const v = body.dataset.v;
				if (v === 'x') {
					// Today: the report is a user message with the header the model reads.
					return userHtml({ text: `[sub-agent #${id} "${c.title}" finished]\n${ANSWERS[id]}`, verdict: '' }).replace('<p class="verdict meta" style="margin:6px 0 0"></p>', '');
				}
				const open = v === 'a' ? `<button class="open" data-tab="${id}">apri la scheda</button>` : v === 'b' ? `<button class="open" data-sheet-open="${id}">guarda il lavoro</button>` : `<button class="open" data-jump="${id}">vai al lavoro</button>`;
				return `<details class="report"><summary><span class="led" data-status="done"></span><span class="who">sub-agent #${id} · ${esc(c.title)}</span><span>finito · ${c.tokens} token · ${c.credits} crediti</span>${open}</summary><div class="body prose" style="font-size:0.9375rem">${md(ANSWERS[id])}</div></details>`;
			}

			function mainLog() {
				return state.log.map((m) => {
					if (m.type === 'user') return userHtml(m);
					if (m.type === 'report') return reportHtml(m.child);
					const parts = [`<div class="prose">${md(m.text)}</div>`];
					// Today the result of delegate is no longer the JSON DelegateView reads: the page falls back to the plain tool line.
					if (m.delegate) parts.push(body.dataset.v === 'x' ? `<div class="tool"><span class="led" data-status="done"></span><span class="name">delegate</span><span class="arg">{"tasks":[${m.delegate.map((id) => `{"title":"${CHILDREN[id].title}","task":"${CHILDREN[id].task}"}`).join(',')}]}</span></div>` : delegateHtml(m.delegate));
					parts.push(`<p class="meta" style="margin:0">${m.usage}</p>`);
					return `<div class="answer">${parts.join('')}</div>`;
				}).join('');
			}

			function childLog(c) {
				const end = c.status === 'done' ? `<p class="end">Finito · ${c.tokens} token · ${c.credits} crediti. I risultati sono andati all'agente.</p>` : '';
				return `<div class="child-log"><p class="task" style="margin:0"><span class="label">compito</span>${esc(c.task)}</p><div class="trace" style="margin:0">${traceHtml(c)}</div>${end}</div>`;
			}

			const composer = (running) => `<form onsubmit="return false"><span class="caret glowtext" aria-hidden="true">›</span><textarea rows="1" placeholder="Chiedi dei progetti, del codice, di come lavora Simone"></textarea><button type="button" class="chip">Invia</button></form><div class="foot"><span style="display:flex;align-items:center;gap:8px"><span class="led" data-status="working"></span>z-ai/glm-5.3-flash</span>${running}<span class="right">privacy</span></div>`;

			function render() {
				const v = body.dataset.v;
				const viewing = v === 'a' && state.view !== 'main' ? state.children[state.view] : null;

				// A: tabs.
				if (v === 'a') {
					const tabs = [`<button class="tab" role="tab" data-tab="main" aria-selected="${state.view === 'main'}"><span class="t">Agente</span>${state.unread ? `<span class="badge">${state.unread}</span>` : ''}</button>`];
					for (const c of childList()) tabs.push(`<button class="tab" role="tab" data-tab="${c.id}" aria-selected="${state.view === c.id}"><span class="led" data-status="${c.status}"></span><span class="t">${esc(c.title)}</span></button>`);
					$('[data-tabs]').innerHTML = tabs.join('');
					$('[data-tabs]').hidden = childList().length === 0;
				}

				$('[data-log]').innerHTML = viewing ? childLog(viewing) : mainLog();

				// The composer.
				const n = live().length;
				let running = '';
				if (v === 'c' && n) running = `<button class="jump" data-jump="card">${n} al lavoro ↑</button>`;
				if (viewing) {
					const stopBtn = viewing.status === 'working' ? `<button class="chip" data-stop="${viewing.id}">Ferma</button>` : '';
					$('[data-compose]').innerHTML = `<div class="readonly"><span class="note">Stai guardando un sub-agent: lavora per l'agente, qui non si scrive.</span>${stopBtn}<button class="chip" data-tab="main">Torna all'agente</button></div>`;
				} else {
					$('[data-compose]').innerHTML = composer(running);
				}

				// B: rail and sheet.
				if (v === 'b') {
					const kids = childList();
					$('[data-rail]').hidden = kids.length === 0;
					$('[data-rail]').innerHTML = kids.map((c) => `<button class="chip" data-sheet-open="${c.id}" aria-pressed="${state.sheet === c.id}"><span class="led" data-status="${c.status}"></span><span class="t">${esc(c.title)}</span><span style="color:var(--subtle)">${STATUS[c.status]}</span></button>`).join('');
					const sheet = $('[data-sheet]');
					const c = state.children[state.sheet];
					if (c) {
						sheet.dataset.open = '';
						sheet.innerHTML = `<header><span class="led" data-status="${c.status}"></span><span class="who">sub-agent #${c.id} · ${esc(c.title)}</span><span>${STATUS[c.status]}</span><span class="acts">${c.status === 'working' ? `<button class="chip" data-stop="${c.id}">Ferma</button>` : ''}<button class="chip" data-sheet-close>Chiudi <span style="color:var(--subtle)">esc</span></button></span></header><div class="inner">${childLog(c)}</div>`;
					} else {
						delete sheet.dataset.open;
					}
					const dock = $('[data-dock]').getBoundingClientRect();
					const win = $('.window').getBoundingClientRect();
					root.style.setProperty('--dock-h', `${Math.round(win.bottom - dock.top + 8)}px`);
				}
				stickBottom();
			}

			let pinned = true;
			const scroller = $('[data-scroll]');
			scroller.addEventListener('scroll', () => { pinned = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40; });
			const stickBottom = () => { if (pinned) scroller.scrollTop = scroller.scrollHeight; };

			document.addEventListener('click', (e) => {
				const t = e.target.closest('button, summary');
				if (!t) return;
				if (t.dataset.tab) {
					state.view = t.dataset.tab === 'main' ? 'main' : Number(t.dataset.tab);
					if (state.view === 'main') state.unread = 0;
					pinned = true;
					render();
				} else if (t.dataset.sheetOpen) {
					const id = Number(t.dataset.sheetOpen);
					state.sheet = state.sheet === id ? null : id;
					render();
				} else if (t.hasAttribute('data-sheet-close')) {
					state.sheet = null;
					render();
				} else if (t.dataset.stop) {
					stop(Number(t.dataset.stop));
				} else if (t.dataset.toggle) {
					const id = Number(t.dataset.toggle);
					state.open[id] = !state.open[id];
					render();
				} else if (t.dataset.jump) {
					const id = Number(t.dataset.jump);
					if (id) state.open[id] = true;
					render();
					$('[data-delegate]')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
				}
			});

			// Concept chrome.
			const pick = (v) => {
				if (!DESC[v]) return;
				body.dataset.v = v;
				document.querySelectorAll('.switch [data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
				$('[data-desc]').textContent = DESC[v];
				document.querySelectorAll('[data-only]').forEach((el) => (el.hidden = !el.dataset.only.split(/\s+/).includes(v)));
				history.replaceState(null, '', `${location.search}#${v}`);
				if (state) {
					state.view = 'main';
					state.sheet = null;
					state.unread = 0;
					render();
				}
			};
			$('[data-buttons]').innerHTML = Object.keys(DESC).map((v) => `<button data-v="${v}">${v.toUpperCase()} ${DESC[v].split(':')[0]}</button>`).join(' ');
			$('.switch').addEventListener('click', (e) => {
				const b = e.target.closest('[data-v]');
				if (b) pick(b.dataset.v);
			});
			const setTheme = (t) => { root.dataset.theme = t; save({ theme: t }); };
			const setPhone = (p) => { body.dataset.phone = p; save({ phone: p }); render(); };
			$('[data-theme-toggle]').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
			$('[data-phone-toggle]').addEventListener('click', () => setPhone(body.dataset.phone === 'on' ? 'off' : 'on'));
			$('[data-restart]').addEventListener('click', reset);
			addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && state.sheet) { state.sheet = null; render(); return; }
				if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
				const k = e.key.toLowerCase();
				if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
				else if (k === 'p') body.dataset.chrome = body.dataset.chrome === 'off' ? 'on' : 'off';
				else if (k === 'm') setPhone(body.dataset.phone === 'on' ? 'off' : 'on');
				else if (k === 'r') reset();
				else pick(k);
			});

			const saved = load();
			root.dataset.theme = saved.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			body.dataset.phone = saved.phone || 'off';
			pick(DESC[location.hash.slice(1)] ? location.hash.slice(1) : 'a');
			reset();
		</script>
	</body>
</html>
