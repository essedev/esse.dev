# pnpm settings: since pnpm 10 they are no longer read from the "pnpm" field of package.json.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - workerd

# Security overrides (M1): minimum versions of vulnerable transitive dependencies.
overrides:
  cookie: '>=0.7.0'
  rollup: '>=4.59.0'
  devalue: '^5.9.2'
